[project]
name = "edge-iot-anomaly-agent"
version = "0.1.0"
description = "Streaming anomaly detection for industrial motor sensors, with a Claude agent that diagnoses each incident"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Harshith Konatham" }]
dependencies = [
    "anthropic>=0.80",
    "duckdb>=1.1",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "pydantic>=2.8",
]

[project.scripts]
iot-agent = "edge_iot_agent.cli:main"

[dependency-groups]
dev = [
    "bandit>=1.8",
    "pip-audit>=2.7",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_iot_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"src/edge_iot_agent/simulator.py" = ["S311"]  # simulated sensor noise, not cryptography

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["edge_iot_agent"]

[tool.coverage.report]
fail_under = 85
show_missing = true
